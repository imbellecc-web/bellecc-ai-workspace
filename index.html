<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>妙綠 AI 工作台🥠</title><style>

ize:19px;margin:0}.btn{border:0;border-radius:11px;padding:9px 14px;background:var(--accent);color:white;cursor:pointer;font-weight:700}.btn.secondary{background:#f1e4da;color:#7b6257}.btn.ghost{background:white;color:#80695e;border:1px solid var(--line)}.list{display:grid;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;background:white;border:1px solid var(--line);border-radius:14px}.item .left{min-width:0}.item strong{display:block}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip{font-size:11px;background:#f5eee8;color:#80695e;border-radius:99px;padding:4px 8px}.split{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat b{font-size:24px}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.input,.select,.textarea{border:1px solid var(--line);background:white;border-radius:11px;padding:10px 12px;outline:0;font:inherit}.textarea{min-height:130px;width:100%;resize:vertical}.input{min-width:190px}.book{display:flex;gap:14px;align-items:center}.cover{width:50px;height:68px;border-radius:9px;background:linear-gradient(145deg,#c69d8d,#e9d4c8);display:grid;place-items:center;color:white;font-weight:800}.modal{position:fixed;inset:0;background:#2e241f55;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modalbox{background:#fffdf9;border:1px solid var(--line);border-radius:20px;padding:24px;width:min(650px,100%);max-height:90vh;overflow:auto}.form{display:grid;gap:12px}.form label{font-size:12px;color:var(--muted)}.bottom{display:none}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:900px){.sidebar{display:none}.main{margin-left:0;padding:22px 16px 95px}.top{display:block}.search{width:100%;margin-top:16px}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;height:68px;background:#fffaf7;border-top:1px solid var(--line);z-index:9;justify-content:space-around}.bottom button{border:0;background:transparent;color:#756960;font-size:11px}.bottom button span{display:block;font-size:20px;margin-bottom:2px}.bottom button.active{color:#9b695a;font-weight:700}}@media(max-width:520px){.grid{grid-template-columns:1fr}.h1{font-size:27px}.card{padding:17px}.stats{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">🌸 妙綠 AI 工作台🥠</div><div class="tag">你的私人 AI 工作室</div><div class="nav" id="sideNav"></div></aside><main class="main"><div id="content"></div></main><nav class="bottom" id="bottomNav"></nav></div><div class="modal" id="modal"><div class="modalbox" id="modalBox"></div></div><script>
const KEY='miaolu_ai_v1';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{records:[{id:1,type:'投資筆記',title:'台積電｜AI需求與估值觀察',text:'觀察 AI 資本支出與估值變化。',tags:['投資','AI'],fav:true,created:Date.now()-86400000},{id:2,type:'自媒體',title:'IG 爆款題材｜投資新手常犯的3個錯誤',text:'用生活化案例拆解投資迷思。',tags:['IG','投資'],fav:false,created:Date.now()-172800000},{id:3,type:'閱讀筆記',title:'《窮查理的普通常識》｜複利',text:'真正重要的是避免永久性損失。',tags:['投資','心理學'],fav:true,created:Date.now()-259200000}],books:[{id:11,title:'窮查理的普通常識',author:'Charlie Munger',category:'投資',status:'閱讀中',progress:72,notes:'把跨學科思考與避免重大錯誤放進投資決策。',created:Date.now()-500000000},{id:12,title:'納瓦爾寶典',author:'Eric Jorgenson',category:'財富',status:'想讀',progress:0,notes:'',created:Date.now()-400000000}],quotes:[{id:21,text:'避免永久性損失，比追求短期高報酬更重要。',book:'窮查理的普通常識',author:'Charlie Munger',page:'',meaning:'提醒自己先控制下行風險。',tags:['投資','決策'],fav:true}],settings:{theme:'暖色'}};let page='dashboard',query='';function save(){localStorage.setItem(KEY,JSON.stringify(data))}function nav(){const groups=[['','🏠 Dashboard'],['投資','📈 股市投資'],['自媒體','📱 自媒體'],['美妝','💄 美妝趨勢'],['閱讀','📚 閱讀'],['紀錄','📝 我的紀錄'],['搜尋','🔍 全域搜尋'],['設定','⚙️ 設定']];document.getElementById('sideNav').innerHTML=groups.map(([p,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('');document.getElementById('bottomNav').innerHTML=[['','🏠','首頁'],['投資','📈','投資'],['閱讀','📚','閱讀'],['自媒體','📱','自媒體'],['紀錄','☰','更多']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}function go(p){page=p;render();scrollTo(0,0)}function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function header(title,desc){return `<div class="top"><div><div class="eyebrow">PRIVATE AI WORKSPACE</div><div class="h1">${title}</div><div class="sub">${desc}</div></div><div class="search">🔍 <input value="${esc(query)}" oninput="query=this.value;render()" placeholder="搜尋我的資料、筆記與收藏…"></div></div>`}function module(icon,title,desc,p){return `<div class="card module" onclick="go('${p}')"><div class="icon">${icon}</div><h3>${title}</h3><div class="muted">${desc}</div></div>`}function actions(){return `<div class="actions"><button class="btn" onclick="openRecord()">＋ 新增紀錄</button><button class="btn secondary" onclick="go('搜尋')">🔍 全域搜尋</button></div>`}function dashboard(){let fav=data.records.filter(x=>x.fav);return header('妙綠 AI 工作台🥠','把投資、內容、美妝與閱讀，整理成一個屬於你的私人知識空間。')+`<div class="grid">${module('📈','股市投資','市場、個股、技術、基本面與筆記','投資')}${module('📱','自媒體','IG、Reels、Threads 與內容靈感','自媒體')}${module('💄','美妝趨勢','品牌、新品、IG／小紅書熱門趨勢','美妝')}${module('📚','閱讀筆記','書庫、AI 整理、金句與閱讀心得','閱讀')}</div><div class="section-title"><h2>今日摘要</h2>${actions()}</div><div class="stats"><div class="card stat"><div class="muted">我的紀錄</div><b>${data.records.length}</b></div><div class="card stat"><div class="muted">收藏</div><b>${data.records.filter(x=>x.fav).length+data.quotes.filter(x=>x.fav).length}</b></div><div class="card stat"><div class="muted">正在閱讀</div><b>${data.books.filter(x=>x.status==='閱讀中').length}</b></div><div class="card stat"><div class="muted">已讀書籍</div><b>${data.books.filter(x=>x.status==='已讀').length}</b></div></div><div class="split"><div><div class="section-title"><h2>最近紀錄</h2></div>${recordList(data.records.slice().sort((a,b)=>b.created-a.created).slice(0,5))}</div><div><div class="section-title"><h2>收藏內容</h2></div>${recordList(fav.slice(0,4))}</div></div><div class="split"><div><div class="section-title"><h2>正在閱讀</h2></div>${bookList(data.books.filter(x=>x.status==='閱讀中'))}</div><div><div class="section-title"><h2>投資相關</h2></div>${recordList(data.records.filter(x=>x.type.includes('投資')).slice(0,4))}</div></div>`}function recordList(arr){if(!arr.length)return '<div class="card empty">目前沒有紀錄</div>';return `<div class="list">${arr.map(x=>`<div class="item"><div class="left"><strong>${esc(x.title)}</strong><div class="muted">${esc(x.text||'')}</div><div class="chips">${(x.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`).join('')}</div></div><div class="actions"><button class="btn ghost" onclick="toggleFav(${x.id})">${x.fav?'★':'☆'}</button><button class="btn ghost" onclick="editRecord(${x.id})">編輯</button><button class="btn ghost" onclick="delRecord(${x.id})">刪除</button></div></div>`).join('')}</div>`}function bookList(arr){if(!arr.length)return '<div class="card empty">目前沒有書籍</div>';return `<div class="list">${arr.map(b=>`<div class="item"><div class="book"><div class="cover">📖</div><div><strong>${esc(b.title)}</strong><div class="muted">${esc(b.author)} · ${esc(b.category)} · ${b.status}</div><div class="muted">進度 ${b.progress}%</div></div></div><button class="btn ghost" onclick="editBook(${b.id})">查看</button></div>`).join('')}</div>`}
function invest(){return header('📈 股市投資','先建立你的分析與筆記庫，第一版資料儲存在本機瀏覽器。')+`<div class="toolbar"><button class="btn" onclick="openRecord('投資筆記')">＋ 投資筆記</button><button class="btn secondary" onclick="openRecord('個股分析')">＋ 個股分析</button></div><div class="grid">${module('🌏','今日市場','建立今日市場觀察','投資')}${module('📰','財經新聞','保存你想追蹤的新聞與觀點','投資')}${module('📊','技術分析','K線、均線與支撐壓力筆記','投資')}${module('💼','基本面 / 籌碼','整理財報、法人與籌碼觀察','投資')}</div><div class="section-title"><h2>投資紀錄</h2></div>${recordList(data.records.filter(x=>x.type.includes('投資')||x.type.includes('分析')))} `}function media(){return header('📱 自媒體','把靈感變成可保存、可搜尋、可再利用的內容資產。')+`<div class="toolbar"><button class="btn" onclick="openRecord('IG 爆款題材')">＋ IG 爆款</button><button class="btn secondary" onclick="openRecord('Reels 腳本')">＋ Reels</button><button class="btn secondary" onclick="openRecord('Threads 文案')">＋ Threads</button></div><div class="grid">${module('🔥','IG 爆款題材','記錄熱門題材與 Hook','自媒體')}${module('🎬','Reels 腳本','開場、腳本、CTA','自媒體')}${module('🧵','Threads 文案','短文與觀點','自媒體')}${module('💡','內容發想','把零碎靈感留下來','自媒體')}</div><div class="section-title"><h2>內容紀錄</h2></div>${recordList(data.records.filter(x=>x.type.includes('自媒體')||x.type.includes('IG')||x.type.includes('Reels')||x.type.includes('Threads')))}</div>`}function beauty(){return header('💄 美妝趨勢','建立你的私人美妝趨勢資料庫。')+`<div class="grid">${module('🔥','流行趨勢','色彩、妝感、風格','美妝')}${module('💎','熱門品牌','品牌與市場觀察','美妝')}${module('✨','新品','新品上市與特色','美妝')}${module('📱','IG／小紅書','社群熱門題材','美妝')}</div><div class="toolbar"><button class="btn" onclick="openRecord('美妝趨勢')">＋ 新增趨勢</button></div><div class="section-title"><h2>趨勢紀錄</h2></div>${recordList(data.records.filter(x=>x.type.includes('美妝')))}</div>`}
function reading(){let subpage=window.readingPage||'dashboard';if(subpage==='books')return readingBooks();if(subpage==='quotes')return readingQuotes();if(subpage==='ai')return readingAI();if(subpage==='categories')return readingCategories();if(subpage==='detail')return bookDetail(window.readingBookId);return readingDashboard()}
function readingNav(){return `<div class="toolbar"><button class="btn" onclick="readingGo('dashboard')">📚 Dashboard</button><button class="btn secondary" onclick="readingGo('books')">📖 我的書庫</button><button class="btn secondary" onclick="readingGo('ai')">✨ AI 閱讀整理</button><button class="btn secondary" onclick="readingGo('quotes')">⭐ 金句收藏</button><button class="btn secondary" onclick="readingGo('categories')">🏷️ 分類</button></div>`}
function readingGo(p,id=null){window.readingPage=p;window.readingBookId=id;render();scrollTo(0,0)}
function readingDashboard(){let r=data.books.filter(x=>x.status==='閱讀中'),w=data.books.filter(x=>x.status==='想讀'),d=data.books.filter(x=>x.status==='已讀'),n=data.records.filter(x=>x.type==='閱讀筆記').slice(0,5),q=data.quotes.filter(x=>x.fav).slice(0,5);return header('📚 閱讀工作台','你的私人數位讀書筆記庫：閱讀、整理、收藏與搜尋。')+readingNav()+`<div class="stats"><div class="card stat"><div class="muted">書庫總數</div><b>${data.books.length}</b></div><div class="card stat"><div class="muted">已讀</div><b>${d.length}</b></div><div class="card stat"><div class="muted">閱讀中</div><b>${r.length}</b></div><div class="card stat"><div class="muted">收藏金句</div><b>${data.quotes.filter(x=>x.fav).length}</b></div></div><div class="section-title"><h2>閱讀狀態</h2><button class="btn" onclick="openBook()">＋ 新增書籍</button></div><div class="grid">${module('📖','正在閱讀',`${r.length} 本`,'閱讀')}${module('🌱','想讀',`${w.length} 本`,'閱讀')}${module('✓','已讀',`${d.length} 本`,'閱讀')}${module('⭐','金句收藏',`${data.quotes.filter(x=>x.fav).length} 則`,'閱讀')}</div><div class="split"><div><div class="section-title"><h2>閱讀中的書籍</h2></div>${bookList(r)}</div><div><div class="section-title"><h2>最近新增閱讀筆記</h2></div>${recordList(n)}</div></div><div class="section-title"><h2>最近收藏的金句</h2></div>${quoteList(q)}`}
function readingBooks(){let arr=data.books.filter(b=>!query||[b.title,b.author,b.category,(b.tags||[]).join(' ')].join(' ').toLowerCase().includes(query.toLowerCase()));return header('📖 我的書庫','管理書籍、閱讀狀態、進度、評分與標籤。')+readingNav()+`<div class="toolbar"><button class="btn" onclick="openBook()">＋ 新增書籍</button><input class="input" placeholder="搜尋書名／作者／分類／標籤" value="${esc(query)}" oninput="query=this.value;render()"></div>${bookList(arr)}`}
function bookList(arr){if(!arr.length)return '<div class="card empty">目前沒有符合的書籍</div>';return `<div class="list">${arr.map(b=>`<div class="item"><div class="book" onclick="readingGo('detail',${b.id})" style="cursor:pointer"><div class="cover">📖</div><div><strong>${esc(b.title)}</strong><div class="muted">${esc(b.author)} · ${esc(b.category)} · ${esc(b.status)}</div><div class="muted">進度 ${b.progress||0}% ${b.rating?`· 評分 ${b.rating}/5`:''}</div><div class="chips">${(b.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`).join('')}</div></div></div><div class="actions"><button class="btn ghost" onclick="readingGo('detail',${b.id})">查看</button><button class="btn ghost" onclick="toggleBookFav(${b.id})">${b.fav?'★':'☆'}</button><button class="btn ghost" onclick="openBook(${b.id})">編輯</button><button class="btn ghost" onclick="delBook(${b.id})">刪除</button></div></div>`).join('')}</div>`}
function bookDetail(id){let b=data.books.find(x=>x.id===id);if(!b){return readingBooks()}let notes=data.records.filter(x=>x.type==='閱讀筆記'&&(x.bookId===id||x.book===b.title));return header('📖 '+esc(b.title),`${esc(b.author)} · ${esc(b.category)}`)+readingNav()+`<div class="toolbar"><button class="btn" onclick="openRecord('閱讀筆記',null,${b.id},'${esc(b.title).replace(/'/g,"&#039;")}')">＋ 新增閱讀筆記</button><button class="btn secondary" onclick="openQuoteForBook(${b.id})">＋ 新增金句</button><button class="btn ghost" onclick="openBook(${b.id})">編輯書籍</button><button class="btn ghost" onclick="toggleBookFav(${b.id})">${b.fav?'★ 已收藏':'☆ 收藏書籍'}</button></div><div class="card"><div class="book"><div class="cover" style="width:70px;height:92px">📖</div><div><h2 style="margin:0 0 6px">${esc(b.title)}</h2><div class="muted">作者：${esc(b.author)}</div><div class="muted">狀態：${esc(b.status)} · 進度 ${b.progress||0}% · ${b.rating?`評分 ${b.rating}/5`:'尚未評分'}</div><div class="chips">${(b.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`).join('')}</div></div></div><p>${esc(b.notes||'尚未寫下書籍摘要。')}</p></div><div class="section-title"><h2>閱讀筆記</h2></div>${recordList(notes)}<div class="section-title"><h2>本書金句</h2></div>${quoteList(data.quotes.filter(q=>q.book===b.title),true)}`}
function readingAI(){return header('✨ AI 閱讀整理','第一版使用示範 AI 結果，未連接 API。')+readingNav()+`<div class="card"><div class="muted">書籍內容／我的閱讀筆記</div><textarea class="textarea" id="aiText" placeholder="貼上書籍內容、章節摘要或你的閱讀筆記…"></textarea><div class="toolbar"><button class="btn" onclick="aiMockFull()">✨ AI 幫我整理</button></div><div id="aiResult"></div></div>`}
function aiMockFull(){

  const text = document.getElementById('aiText').value.trim();
  const result = document.getElementById('aiResult');

  if (!text) {
    result.innerHTML = `
      <div class="card" style="margin-top:16px">
        請先貼上書籍內容或閱讀筆記。
      </div>
    `;
    return;
  }

  const prompt = `你是我的私人閱讀助理。

請分析以下書籍內容或閱讀筆記。

【內容開始】
${text}
【內容結束】

請用繁體中文，按照以下 9 個部分整理：

📌 核心觀念
整理 3～5 個真正重要的核心觀念。

💡 作者主要觀點
說明作者真正想傳達的主要思想。

⭐ 重要金句
從內容中找出值得保留的關鍵句。
如果原文沒有明確金句，不要自行假造。

🧠 我的理解
用白話說明這些觀念。

🚀 可以實踐
列出具體、可以真正執行的行動。

📈 與投資的關聯
分析如何應用在投資、選股、風險管理、資產配置或投資心理。

💼 與職涯的關聯
分析如何應用在職涯選擇、學習、工作效率、決策或轉職。

📱 與自媒體的關聯
分析哪些觀念可以轉化成 IG、Threads、Reels 或其他內容。

🤔 值得思考的問題
提出 3 個可以幫助我深入思考的問題。

請避免空泛的雞湯。
請盡量根據我提供的內容回答。
請用清楚的標題與條列方式整理。`;

  window.aiDraft = {
    input: text,
    prompt: prompt
  };

  result.innerHTML = `

function saveReturnedAIResult(){

  const text = document.getElementById('aiReturnedText')?.value.trim();

  if (!text) {
    alert('請先貼上 ChatGPT 的整理結果。');
    return;
  }

  const input = window.aiDraft?.input || '';

  const records = JSON.parse(
    localStorage.getItem('readingRecords') || '[]'
  );

  records.push({
    id: Date.now(),
    type: 'AI 閱讀整理',
    content: text,
    source: input,
    createdAt: new Date().toLocaleString()
  });

  localStorage.setItem(
    'readingRecords',
    JSON.stringify(records)
  );

  alert('✨ AI 閱讀整理已儲存！');

}
function copyReadingPrompt(){

  if (!window.aiDraft || !window.aiDraft.prompt) return;

  navigator.clipboard.writeText(window.aiDraft.prompt)
    .then(() => {
      alert('已複製 AI 閱讀整理指令！');
    })
    .catch(() => {
      alert('複製失敗，請再試一次。');
    });
}

function quoteList(arr,full=false){if(!arr.length)return '<div class="card empty">目前沒有金句</div>';return `<div class="list">${arr.map(q=>`<div class="item"><div class="left"><strong>“${esc(q.text)}”</strong><div class="muted">${esc(q.book)} · ${esc(q.author)} ${q.page?'· '+esc(q.page):''}</div><div class="muted">${esc(q.meaning||'')}</div><div class="chips">${(q.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`).join('')}</div><div class="muted">${q.created?new Date(q.created).toLocaleDateString('zh-TW'):''}</div></div><div class="actions"><button class="btn ghost" onclick="toggleQuote(${q.id})">${q.fav?'★':'☆'}</button>${full?`<button class="btn ghost" onclick="openQuote(${q.id})">編輯</button><button class="btn ghost" onclick="delQuote(${q.id})">刪除</button>`:''}</div></div>`).join('')}</div>`}

function records(){let arr=filter(data.records);return header('📝 我的紀錄','所有工作台產生的內容，都可以在這裡管理。')+`<div class="toolbar"><select class="select" id="typeFilter" onchange="render()"><option value="">全部類型</option><option>投資筆記</option><option>自媒體</option><option>美妝趨勢</option><option>閱讀筆記</option></select><button class="btn" onclick="openRecord()">＋ 新增</button></div>${recordList(arr)}`}function filter(arr){let f=document.getElementById('typeFilter')?.value||'';return arr.filter(x=>(!f||x.type===f)&&(!query||[x.title,x.text,x.type,...(x.tags||[])].join(' ').toLowerCase().includes(query.toLowerCase())))}function searchPage(){let r=filter(data.records),b=data.books.filter(x=>!query||[x.title,x.author,x.category].join(' ').toLowerCase().includes(query.toLowerCase())),q=data.quotes.filter(x=>!query||[x.text,x.book,x.author,x.meaning].join(' ').toLowerCase().includes(query.toLowerCase()));return header('🔍 全域搜尋','一次搜尋投資、自媒體、美妝、閱讀與收藏。')+`<div class="section-title"><h2>搜尋結果</h2><span class="muted">${r.length+b.length+q.length} 筆</span></div><h3>紀錄</h3>${recordList(r)}<h3>書籍</h3>${bookList(b)}<h3>金句</h3>${q.map(x=>`<div class="item"><div><strong>“${esc(x.text)}”</strong><div class="muted">${esc(x.book)}</div></div></div>`).join('')||'<div class="card empty">沒有符合的內容</div>'}`}function settings(){return header('⚙️ 設定','第一版只使用瀏覽器本地儲存，不連接資料庫。')+`<div class="card"><h3>資料管理</h3><p class="muted">所有新增、編輯、收藏與書籍資料目前保存在這個瀏覽器的 localStorage。</p><button class="btn secondary" onclick="exportData()">匯出我的資料</button> <button class="btn ghost" onclick="resetData()">重設示範資料</button></div>`}
function openRecord(type='一般筆記',id=null,bookId=null,bookTitle=''){let x=id?data.records.find(a=>a.id===id):null;document.getElementById('modalBox').innerHTML=`<h2>${x?'編輯':'新增'}紀錄</h2><div class="form"><label>類型</label><input class="input" id="fType" value="${esc(x?.type||type)}"><label>標題</label><input class="input" id="fTitle" value="${esc(x?.title||'')}"><label>關聯書籍</label><input class="input" id="fBook" value="${esc(x?.book||bookTitle||'')}"><label>內容</label><textarea class="textarea" id="fText">${esc(x?.text||'')}</textarea><label>標籤（用逗號分隔）</label><input class="input" id="fTags" value="${esc((x?.tags||[]).join(','))}"><div class="actions"><button class="btn" onclick="saveRecord(${id||0})">儲存</button><button class="btn ghost" onclick="closeModal()">取消</button></div></div>`;showModal()}function saveRecord(id){let obj={id:id||Date.now(),type:fType.value||'一般筆記',title:fTitle.value||'未命名',text:fText.value,book:fBook?.value||'',bookId:bookId||undefined,tags:fTags.value.split(',').map(x=>x.trim()).filter(Boolean),fav:id?(data.records.find(x=>x.id===id)?.fav||false):false,created:id?(data.records.find(x=>x.id===id)?.created||Date.now()):Date.now()};if(id){data.records=data.records.map(x=>x.id===id?obj:x)}else data.records.unshift(obj);save();closeModal();render()}function editRecord(id){openRecord('',id)}function delRecord(id){if(confirm('確定刪除這筆紀錄？')){data.records=data.records.filter(x=>x.id!==id);save();render()}}function toggleFav(id){let x=data.records.find(a=>a.id===id);if(x)x.fav=!x.fav;save();render()}function openBook(id=null){let b=id?data.books.find(x=>x.id===id):null;document.getElementById('modalBox').innerHTML=`<h2>${b?'編輯':'新增'}書籍</h2><div class="form"><label>書名</label><input class="input" id="bTitle" value="${esc(b?.title||'')}"><label>作者</label><input class="input" id="bAuthor" value="${esc(b?.author||'')}"><label>分類</label><input class="input" id="bCat" value="${esc(b?.category||'投資')}"><label>閱讀狀態</label><select class="select" id="bStatus"><option ${b?
