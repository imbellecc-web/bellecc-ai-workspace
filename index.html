t:1.2}.btn:hover{filter:brightness(.97)}.btn.secondary{background:#f0e4dc;color:#72584b;border-color:#dfcbbd}.btn.ghost{background:transparent;color:#80695e;border-color:var(--line)}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:white;color:var(--text);border-radius:11px;padding:10px 12px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#c9a995;box-shadow:0 0 0 3px rgba(201,169,149,.13)}.toolbar .input,.toolbar .select{width:auto;min-width:190px}.textarea{min-height:150px;resize:vertical;line-height:1.7}.list{display:flex;flex-direction:column;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:18px;background:white;border:1px solid var(--line);border-radius:15px;padding:15px 17px}.left{min-width:0}.left strong,.item strong{display:block;margin-bottom:5px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{display:inline-flex;align-items:center;background:#f4ebe5;color:#80695e;border-radius:999px;padding:4px 9px;font-size:12px}.book{display:flex;align-items:center;gap:14px;min-width:0}.cover{width:48px;height:62px;border-radius:9px;background:#f1e4dc;display:flex;align-items:center;justify-content:center;flex:none;font-size:24px;border:1px solid #e5d3c7}.empty{text-align:center;color:var(--muted)}.form{display:flex;flex-direction:column;gap:8px}.form label{font-size:13px;color:#75665e;margin-top:6px}.modal{position:fixed;inset:0;background:rgba(50,38,31,.32);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fffdfb;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 25px 70px rgba(50,38,31,.18)}.modalbox h2{margin-top:0}.bottom{display:none}.table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:16px}.table-wrap table{width:100%;border-collapse:collapse;min-width:680px}.table-wrap th,.table-wrap td{pad
