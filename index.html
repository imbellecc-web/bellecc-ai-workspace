<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>妙綠 AI 工作台🥠</title><style>
 :root{--bg:#fbf8f4;--card:#fffdfb;--line:#eadfd6;--text:#3f3834;--muted:#8d8178;--accent:#a77b68;--accent2:#d9b9a7;--soft:#f5ebe4;--shadow:0 10px 30px rgba(100,75,60,.07)}*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;padding:28px 18px;background:rgba(255,253,251,.96);border-right:1px solid var(--line);z-index:10}.brand{font-size:21px;font-weight:800;letter-spacing:.2px}.tag{margin-top:7px;color:var(--muted);font-size:13px}.nav{margin-top:28px;display:flex;flex-direction:column;gap:7px}.nav button{border:0;background:transparent;color:#665b55;text-align:left;padding:12px 13px;border-radius:13px;font-weight:600}.nav button:hover{background:var(--soft)}.nav button.active{background:#ead9cf;color:#6e5144}.main{width:calc(100% - 230px);margin-left:230px;padding:34px 42px 70px;min-height:100vh}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:2px;color:#a58b7c;margin-bottom:7px}.h1{font-size:30px;font-weight:800;line-height:1.25}.sub{margin-top:7px;color:var(--muted);line-height:1.7}.search{min-width:280px;display:flex;align-items:center;gap:8px;background:white;border:1px solid var(--line);border-radius:14px;padding:10px 13px;color:#a18f84;box-shadow:var(--shadow)}.search input{border:0;outline:0;width:100%;background:transparent;color:var(--text)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.module{transition:.18s;cursor:pointer;min-height:145px}.module:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(100,75,60,.11)}.module .icon{font-size:28px;margin-bottom:12px}.module h3{margin:0 0 7px;font-size:17px}.muted{color:var(--muted);font-size:13px;line-height:1.7}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 13px}.section-title h2{margin:0;font-size:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat b{display:block;font-size:28px;margin-top:5px}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.btn{border:1px solid var(--accent);background:var(--accent);color:white;padding:9px 14px;border-radius:11px;font-weight:700;line-height:1.2}.btn:hover{filter:brightness(.97)}.btn.secondary{background:#f0e4dc;color:#72584b;border-color:#dfcbbd}.btn.ghost{background:transparent;color:#80695e;border-color:var(--line)}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:white;color:var(--text);border-radius:11px;padding:10px 12px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#c9a995;box-shadow:0 0 0 3px rgba(201,169,149,.13)}.toolbar .input,.toolbar .select{width:auto;min-width:190px}.textarea{min-height:150px;resize:vertical;line-height:1.7}.list{display:flex;flex-direction:column;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:18px;background:white;border:1px solid var(--line);border-radius:15px;padding:15px 17px}.left{min-width:0}.left strong,.item strong{display:block;margin-bottom:5px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{display:inline-flex;align-items:center;background:#f4ebe5;color:#80695e;border-radius:999px;padding:4px 9px;font-size:12px}.book{display:flex;align-items:center;gap:14px;min-width:0}.cover{width:48px;height:62px;border-radius:9px;background:#f1e4dc;display:flex;align-items:center;justify-content:center;flex:none;font-size:24px;border:1px solid #e5d3c7}.empty{text-align:center;color:var(--muted)}.form{display:flex;flex-direction:column;gap:8px}.form label{font-size:13px;color:#75665e;margin-top:6px}.modal{position:fixed;inset:0;background:rgba(50,38,31,.32);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fffdfb;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 25px 70px rgba(50,38,31,.18)}.modalbox h2{margin-top:0}.bottom{display:none}.table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:16px}.table-wrap table{width:100%;border-collapse:collapse;min-width:680px}.table-wrap th,.table-wrap td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}.table-wrap th{background:#f8f0e9;color:#80695e;font-size:13px}.table-wrap tr:last-child td{border-bottom:0}.table-wrap .btn{display:inline-block;text-decoration:none;white-space:nowrap}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:stretch;flex-direction:column}.search{min-width:0}.main{padding:28px 26px}}@media(max-width:720px){.sidebar{display:none}.main{width:100%;margin-left:0;padding:22px 15px 82px}.bottom{position:fixed;display:flex;left:0;right:0;bottom:0;height:66px;background:rgba(255,253,251,.97);border-top:1px solid var(--line);z-index:20;justify-content:space-around;padding:7px 4px}.bottom button{border:0;background:transparent;color:#85766d;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px}.bottom button span{font-size:19px}.bottom button.active{color:#8b6554;font-weight:800}.h1{font-size:25px}.grid,.stats{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.item>.actions{width:100%}.toolbar .input,.toolbar .select{width:100%;min-width:0}.btn{padding:9px 12px}}@media(max-width:430px){.grid,.stats{grid-template-columns:1fr}.card{padding:16px}.module{min-height:auto}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">妙綠 AI 工作台🥠</div><div class="tag">你的私人 AI 工作室</div><div class="nav" id="sideNav"></div></aside><main class="main"><div id="content"></div></main><nav class="bottom" id="bottomNav"></nav></div><div class="modal" id="modal"><div class="modalbox" id="modalBox"></div></div><script>
const KEY='miaolu_ai_v1';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{records:[{id:1,type:'投資筆記',title:'台積電｜AI需求與估值觀察',text:'觀察 AI 資本支出與估值變化。',tags:['投資','AI'],fav:true,created:Date.now()-86400000},{id:2,type:'自媒體',title:'IG 爆款題材｜投資新手常犯的3個錯誤',text:'用生活化案例拆解投資迷思。',tags:['IG','投資'],fav:false,created:Date.now()-172800000},{id:3,type:'閱讀筆記',title:'《窮查理的普通常識》｜複利',text:'真正重要的是避免永久性損失。',tags:['投資','心理學'],fav:true,created:Date.now()-259200000}],books:[{id:11,title:'窮查理的普通常識',author:'Charlie Munger',category:'投資',status:'閱讀中',progress:72,notes:'把跨學科思考與避免重大錯誤放進投資決策。',created:Date.now()-500000000},{id:12,title:'納瓦爾寶典',author:'Eric Jorgenson',category:'財富',status:'想讀',progress:0,notes:'',created:Date.now()-400000000}],quotes:[{id:21,text:'避免永久性損失，比追求短期高報酬更重要。',book:'窮查理的普通常識',author:'Charlie Munger',page:'',meaning:'提醒自己先控制下行風險。',tags:['投資','決策'],fav:true}],settings:{theme:'暖色'}};let page='dashboard',query='';function save(){localStorage.setItem(KEY,JSON.stringify(data))}function nav(){const groups=[['','🏠 Dashboard'],['投資','📈 股市投資'],['自媒體','📱 自媒體'],['美妝','💄 美妝趨勢'],['閱讀','📚 閱讀'],['紀錄','📝 我的紀錄'],['搜尋','🔍 全域搜尋'],['設定','⚙️ 設定']];document.getElementById('sideNav').innerHTML=groups.map(([p,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('');document.getElementById('bottomNav').innerHTML=[['','🏠','首頁'],['投資','📈','投資'],['閱讀','📚','閱讀'],['自媒體','📱','自媒體'],['紀錄','☰','更多']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}function go(p){page=p;render();scrollTo(0,0)}function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function header(title,desc){return `<div class="top"><div><div class="eyebrow">PRIVATE AI WORKSPACE</div><div class="h1">${title}</div><div class="sub">${desc}</div></div><div class="search">🔍 <input value="${esc(query)}" oninput="query=this.value;render()" placeholder="搜尋我的資料、筆記與收藏…"></div></div>`}function module(icon,title,desc,p){return `<div class="card module" onclick="go('${p}')"><div class="icon">${icon}</div><h3>${title}</h3><div class="muted">${desc}</div></div>`}function actions(){return `<div class="actions"><button class="btn" onclick="openRecord()">＋ 新增紀錄</button><button class="btn secondary" onclick="go('搜尋')">🔍 全域搜尋</button></div>`}function dashboard(){let fav=data.records.filter(x=>x.fav);return header('妙綠 AI 工作台🥠','把投資、內容、美妝與閱讀，整理成一個屬於你的私人知識空間。')+`<div class="grid">${module('📈','股市投資','市場、個股、技術、基本面與筆記','投資')}${module('📱','自媒體','IG、Reels、Threads 與內容靈感','自媒體')}${module('💄','美妝趨勢','品牌、新品、IG／小紅書熱門趨勢','美妝')}${module('📚','閱讀筆記','書庫、AI 整理、金句與閱讀心得','閱讀')}</div><div class="section-title"><h2>今日摘要</h2>${actions()}</div><div class="stats"><div class="card stat"><div class="muted">我的紀錄</div><b>${data.records.length}</b></div><div class="card stat"><div class="muted">收藏</div><b>${data.records.filter(x=>x.fav).length+data.quotes.filter(x=>x.fav).length}</b></div><div class="card stat"><div class="muted">正在閱讀</div><b>${data.books.filter(x=>x.status==='閱讀中').length}</b></div><div class="card stat"><div class="muted">已讀書籍</div><b>${data.books.filter(x=>x.status==='已讀').length}</b></div></div><div class="split"><div><div class="section-title"><h2>最近紀錄</h2></div>${recordList(data.records.slice().sort((a,b)=>b.created-a.created).slice(0,5))}</div><div><div class="section-title"><h2>收藏內容</h2></div>${recordList(fav.slice(0,4))}</div></div><div class="split"><div><div class="section-title"><h2>正在閱讀</h2></div>${bookList(data.books.filter(x=>x.status==='閱讀中'))}</div><div><div class="section-title"><h2>投資相關</h2></div>${recordList(data.records.filter(x=>x.type.includes('投資')).slice(0,4))}</div></div>`}function recordList(arr){if(!arr.length)return '<div class="card empty">目前沒有紀錄</div>';return `<div class="list">${arr.map(x=>`<div class="item"><div class="left"><strong>${esc(x.title)}</strong><div class="muted">${esc(x.text||'')}</div><div class="chips">${(x.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`).join('')}</div></div><div class="actions"><button class="btn ghost" onclick="toggleFav(${x.id})">${x.fav?'★':'☆'}</button><button class="btn ghost" onclick="editRecord(${x.id})">編輯</button><button class="btn ghost" onclick="delRecord(${x.id})">刪除</button></div></div>`).join('')}</div>`}function bookList(arr){if(!arr.length)return '<div class="card empty">目前沒有書籍</div>';return `<div class="list">${arr.map(b=>`<div class="item"><div class="book"><div class="cover">📖</div><div><strong>${esc(b.title)}</strong><div class="muted">${esc(b.author)} · ${esc(b.category)} · ${b.status}</div><div class="muted">進度 ${b.progress}%</div></div></div><button class="btn ghost" onclick="editBook(${b.id})">查看</button></div>`).join('')}</div>`}
function invest(){let r=data.records.filter(x=>x.type.includes('投資')||x.type.includes('分析')||x.type.includes('市場')||x.type.includes('新聞')||x.type.includes('技術')||x.type.includes('基本面'));return header('📈 股市投資','先完成市場觀察、個股分析、技術面與基本面的工作雛型，之後再逐步加入更完整的資料來源。')+`<div class="stats"><div class="card stat"><div class="muted">📋 投資紀錄</div><b>${r.length}</b></div><div class="card stat"><div class="muted">⭐ 收藏</div><b>${r.filter(x=>x.fav).length}</b></div><div class="card stat"><div class="muted">📊 個股分析</div><b>${data.records.filter(x=>x.type==='個股分析').length}</b></div><div class="card stat"><div class="muted">📰 市場觀察</div><b>${data.records.filter(x=>x.type==='市場觀察'||x.type==='財經新聞').length}</b></div></div><div class="toolbar"><button class="btn" onclick="openRecord('市場觀察')">＋ 今日市場</button><button class="btn secondary" onclick="openRecord('個股分析')">＋ 個股分析</button><button class="btn secondary" onclick="openRecord('財經新聞')">＋ 財經新聞</button><button class="btn secondary" onclick="openRecord('投資筆記')">＋ 投資筆記</button></div><div class="grid">${module('🌏','今日市場','大盤、台股、美股、匯率與重要事件','投資')}${module('🎯','自選個股','建立個股觀察與投資理由','投資')}${module('📊','技術分析','K線、均線、乖離、支撐與壓力','投資')}${module('💼','基本面 / 籌碼','EPS、營收、法人、融資融券與籌碼','投資')}</div><div class="section-title"><h2>📝 最近投資紀錄</h2></div>${recordList(r.slice().sort((a,b)=>b.created-a.created))}`}function media(){let r=data.records.filter(x=>x.type.includes('自媒體')||x.type.includes('IG')||x.type.includes('Reels')||x.type.includes('Threads'));return header('📱 自媒體','每週找熱門題材、整理 5 個 IG 文章方向、3 篇 Reels，並把一個靈感拆成 Threads 與多平台內容。')+`<div class="stats"><div class="card stat"><div class="muted">🔥 IG 題材</div><b>${r.filter(x=>x.type.includes('IG')).length}</b></div><div class="card stat"><div class="muted">🎬 Reels 腳本</div><b>${r.filter(x=>x.type.includes('Reels')).length}</b></div><div class="card stat"><div class="muted">🧵 Threads</div><b>${r.filter(x=>x.type.includes('Threads')).length}</b></div><div class="card stat"><div class="muted">📚 內容庫</div><b>${r.length}</b></div></div><div class="grid">${module('🔥','IG 題材庫','每週找熱門趨勢，整理成 5 個可發展的文章方向','自媒體')}${module('🎬','Reels 腳本','每週分析熱門短影音，產出 3 篇可直接拍的腳本','自媒體')}${module('🧵','Threads','快速產生觀點、共鳴、提問型短文並累積草稿','自媒體')}${module('💡','內容發想','累積靈感，並把一個想法拆成 IG＋Reels＋Threads','自媒體')}</div><div class="section-title"><h2>🔥 IG 題材庫｜每週找 5 個方向</h2><button class="btn" onclick="generateIGDirections()">🔄 本週找題材</button></div><div class="card" style="background:#f8f0e9"><div class="muted">📅 每週流程：找熱門趨勢 → 篩選適合你的題材 → 整理成 5 個文章方向 → 可直接存進內容庫。</div></div><div id="igDirections" class="list"></div><div class="section-title"><h2>🎬 Reels 腳本｜每週生產 3 篇</h2><button class="btn" onclick="generateReelsScripts()">🔄 本週生產腳本</button></div><div class="card" style="background:#f8f0e9"><div class="muted">📅 每週流程：分析熱門短影音 → 拆解 Hook／節奏／結尾 → 改編成你的內容 → 產出 3 篇腳本。</div></div><div id="reelsScripts" class="grid"></div><div class="section-title"><h2>🧵 Threads｜快速發佈與互動</h2><button class="btn" onclick="generateThreads()">🔄 產生 3 篇 Threads</button></div><div class="card" style="background:#f8f0e9"><div class="muted">📅 每週流程：選一個熱門或你的觀點 → 產生 ①觀點型 ②共鳴型 ③提問型 → 加入互動問題 → 可存成草稿。</div></div><div id="threadsDrafts" class="grid"></div><div class="section-title"><h2>💡 內容發想｜你的長期題材庫</h2><button class="btn" onclick="openRecord('內容發想')">＋ 收集靈感</button></div><div class="card" style="background:#f8f0e9"><div class="muted">把看到的熱門內容、日常觀察、遇到的問題與突然想到的點子先留下，再整理成「投資／美妝／職涯人生／個人成長」四大方向。之後一個靈感可以延伸成 IG 文章、Reels、Threads。</div></div><div class="grid">${module('📈','投資','投資觀察、錯誤、決策與市場心得','自媒體')}${module('💄','美妝','新品、實測、趨勢與使用心得','自媒體')}${module('💼','職涯／人生','轉職、學習、選擇與生活觀察','自媒體')}${module('🧠','個人成長','閱讀、習慣、心理與自我提升','自媒體')}</div><div class="section-title"><h2>📝 最近內容</h2></div>${recordList(r.slice().sort((a,b)=>b.created-a.created).slice(0,8))}`}
function generateThreads(){let arr=[['① 觀點型','我最近越來越覺得，真正重要的不是「知道很多」，而是能不能把一個觀念真正用在自己的生活裡。你最近有哪個觀念真的改變了你的選擇？','適合：投資／閱讀／職涯／個人成長'],['② 共鳴型','以前我以為，只要一直努力就會越來越好。後來才發現，有些時候真正需要做的，是停下來重新選方向。你也有過這種時候嗎？','適合：人生／職涯／學習／生活'],['③ 提問型','如果現在只能選一件事，讓未來一年的自己變得更好，你會選：①增加收入 ②學一個新技能 ③建立投資習慣 ④經營個人品牌？為什麼？','適合：互動／投票／社群討論']];document.getElementById('threadsDrafts').innerHTML=arr.map(x=>`<div class="card"><div class="chip">🧵 Threads 草稿</div><h3>${x[0]}</h3><p style="line-height:1.8">${esc(x[1])}</p><p class="muted"><strong>🎯 ${x[2]}</strong></p><button class="btn secondary" onclick="openRecord('Threads')">💾 存成草稿</button></div>`).join('')}
function generateIGDirections(){let arr=[['① 熱門趨勢拆解型','把最近爆紅的 Reels 拆成「為什麼會紅、觀眾在看什麼、我可以怎麼改編」的文章。','適合：趨勢觀察／教學／個人觀點'],['② 3 個你以為對，其實錯的觀念','用反常識開場，整理 3 個大家常見但容易踩雷的觀念，最後給出你的方法。','適合：投資／職涯／美妝／生活'],['③ 我的實測與結果','把一個熱門方法真正做一次，公開過程、結果與失敗點，讓內容更有可信度。','適合：產品／學習／投資紀錄'],['④ 一張圖看懂複雜問題','把一個大家常搜尋的問題整理成 5～7 個重點，用輪播圖或短影音做成「收藏型內容」。','適合：知識／理財／職涯'],['⑤ 熱門題材＋你的個人觀點','不只跟風，而是套用熱門格式，再加入自己的經驗、案例或反方觀點，形成辨識度。','適合：建立個人品牌']];document.getElementById('igDirections').innerHTML=arr.map(x=>`<div class="item"><div class="left"><strong>${x[0]}｜${x[1]}</strong><div class="muted" style="margin-top:5px">${x[2]}</div></div><button class="btn ghost" onclick="openRecord('IG 題材')">＋ 存成題材</button></div>`).join('')}

function records(){let arr=filter(data.records);return header('📝 我的紀錄','所有工作台產生的內容，都可以在這裡管理。')+`<div class="toolbar"><select class="select" id="typeFilter" onchange="render()"><option value="">全部類型</option><option>投資筆記</option><option>自媒體</option><option>美妝趨勢</option><option>閱讀筆記</option></select><button class="btn" onclick="openRecord()">＋ 新增</button></div>${recordList(arr)}`}function filter(arr){let f=document.getElementById('typeFilter')?.value||'';return arr.filter(x=>(!f||x.type===f)&&(!query||[x.title,x.text,x.type,...(x.tags||[])].join(' ').toLowerCase().includes(query.toLowerCase())))}function searchPage(){let r=filter(data.records),b=data.books.filter(x=>!query||[x.title,x.author,x.category].join(' ').toLowerCase().includes(query.toLowerCase())),q=data.quotes.filter(x=>!query||[x.text,x.book,x.author,x.meaning].join(' ').toLowerCase().includes(query.toLowerCase()));return header('🔍 全域搜尋','一次搜尋投資、自媒體、美妝、閱讀與收藏。')+`<div class="section-title"><h2>搜尋結果</h2><span class="muted">${r.length+b.length+q.length} 筆</span></div><h3>紀錄</h3>${recordList(r)}<h3>書籍</h3>${bookList(b)}<h3>金句</h3>${q.map(x=>`<div class="item"><div><strong>“${esc(x.text)}”</strong><div class="muted">${esc(x.book)}</div></div></div>`).join('')||'<div class="card empty">沒有符合的內容</div>'}`}function settings(){let t=data.tracking||{freq:'每週',time:'09:00',keywords:''};return header('⚙️ 設定','管理資料與各工作台的更新提醒。')+`<div class="card"><h3>🛰️ 更新提醒</h3><p class="muted">在原有設定中管理免費半自動追蹤：到設定的時間提醒你整理資料。</p><div class="form"><label>更新頻率</label><select class="select" id="trackFreq"><option ${t.freq==='每日'?'selected':''}>每日</option><option ${t.freq==='每週'?'selected':''}>每週</option><option ${t.freq==='每月'?'selected':''}>每月</option></select><label>提醒時間</label><input class="input" id="trackTime" type="time" value="${esc(t.time||'09:00')}"><label>追蹤關鍵字</label><input class="input" id="trackKeywords" placeholder="例如：底妝、腮紅、AI、美股、Threads" value="${esc(t.keywords||'')}"><div class="actions"><button class="btn" onclick="saveTracking()">💾 儲存更新設定</button></div></div></div><div class="card" style="margin-top:16px"><h3>資料管理</h3><p class="muted">所有新增、編輯、收藏與書籍資料目前保存在這個瀏覽器的 localStorage。</p><button class="btn secondary" onclick="exportData()">匯出我的資料</button> <button class="btn ghost" onclick="resetData()">重設示範資料</button></div>`}
function openRecord(type='一般筆記',id=null,bookId=null,bookTitle=''){if(type==='內容發想'){document.getElementById('modalBox').innerHTML=`<h2>💡 內容發想</h2><p class="muted">輸入一個你最近想到的觀察、問題或靈感，系統會幫你拆成 4 種內容。</p><div class="form"><label>你的靈感</label><textarea class="textarea" id="ideaInput" placeholder="例如：最近發現很多人投資一直追高殺低"></textarea><div class="actions"><button class="btn" onclick="generateContentIdeas()">✨ 幫我拆成內容</button><button class="btn ghost" onclick="closeModal()">取消</button></div><div id="contentIdeaResult"></div></div>`;showModal();return}let x=id?data.records.find(a=>a.id===id):null;document.getElementById('modalBox').innerHTML=`<h2>${x?'編輯':'新增'}紀錄</h2><div class="form"><label>類型</label><input class="input" id="fType" value="${esc(x?.type||type)}"><label>標題</label><input class="input" id="fTitle" value="${esc(x?.title||'')}"><label>關聯書籍</label><input class="input" id="fBook" value="${esc(x?.book||bookTitle||'')}"><label>內容</label><textarea class="textarea" id="fText">${esc(x?.text||'')}</textarea><label>標籤（用逗號分隔）</label><input class="input" id="fTags" value="${esc((x?.tags||[]).join(','))}"><div class="actions"><button class="btn" onclick="saveRecord(${id||0})">儲存</button><button class="btn ghost" onclick="closeModal()">取消</button></div></div>`;showModal()}function generateContentIdeas(){const idea=document.getElementById('ideaInput')?.value.trim();const result=document.getElementById('contentIdeaResult');if(!idea){result.innerHTML='<div class="card" style="margin-top:14px">請先輸入一個靈感。</div>';return}const safe=esc(idea);result.innerHTML=`<div style="margin-top:18px;display:grid;gap:10px"><div class="card"><div class="chip">📝 IG 文章</div><h3>5 個「${safe}」值得整理的重點</h3><p class="muted">把這個靈感拆成 5 個觀點，做成收藏型輪播文章。</p></div><div class="card"><div class="chip">🎬 Reels</div><h3>30 秒講清楚「${safe}」</h3><p class="muted">0–3 秒 Hook → 4–20 秒 3 個重點 → 21–27 秒你的觀點 → 28–30 秒互動 CTA。</p></div><div class="card"><div class="chip">🧵 Threads</div><h3>一句話引發討論</h3><p class="muted">「${safe}」——你也有過這種情況嗎？你會怎麼看？</p></div><div class="card"><div class="chip">📚 深度文章</div><h3>「${safe}」的深度分析</h3><p class="muted">從原因、心理、案例、解決方法與你的實際經驗延伸成完整文章。</p></div></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="saveContentIdea()">💾 儲存這個靈感</button></div>`;window.contentIdeaDraft={idea}}function saveContentIdea(){const idea=window.contentIdeaDraft?.idea;if(!idea)return;data.records.unshift({id:Date.now(),type:'內容發想',title:idea,text:'IG：5 個重點｜Reels：30 秒｜Threads：一句話討論｜深度文章：完整分析',tags:['內容發想'],fav:false,created:Date.now()});save();closeModal();render()}function saveRecord(id){let obj={id:id||Date.now(),type:fType.value||'一般筆記',title:fTitle.value||'未命名',text:fText.value,book:fBook?.value||'',bookId:bookId||undefined,tags:fTags.value.split(',').map(x=>x.trim()).filter(Boolean),fav:id?(data.records.find(x=>x.id===id)?.fav||false):false,created:id?(data.records.find(x=>x.id===id)?.created||Date.now()):Date.now()};if(id){data.records=data.records.map(x=>x.id===id?obj:x)}else data.records.unshift(obj);save();closeModal();render()}function editRecord(id){openRecord('',id)}function delRecord(id){if(confirm('確定刪除這筆紀錄？')){data.records=data.records.filter(x=>x.id!==id);save();render()}}function toggleFav(id){let x=data.records.find(a=>a.id===id);if(x)x.fav=!x.fav;save();render()}function openBook(id=null){let b=id?data.books.find(x=>x.id===id):null;document.getElementById('modalBox').innerHTML=`<h2>${b?'編輯':'新增'}書籍</h2><div class="form"><label>書名</label><input class="input" id="bTitle" value="${esc(b?.title||'')}"><label>作者</label><input class="input" id="bAuthor" value="${esc(b?.author||'')}"><label>分類</label><input class="input" id="bCat" value="${esc(b?.category||'投資')}"><label>閱讀狀態</label><select class="select" id="bStatus"><option ${b?.status==='想讀'?'selected':''}>想讀</option><option ${b?.status==='閱讀中'?'selected':''}>閱讀中</option><option ${b?.status==='已讀'?'selected':''}>已讀</option></select><label>閱讀進度：<span id="progV">${b?.progress||0}</span>%</label><input type="range" id="bProg" min="0" max="100" value="${b?.progress||0}" oninput="progV.textContent=this.value"><label>開始閱讀日期</label><input class="input" id="bStart" type="date" value="${esc(b?.startDate||'')}"><label>完成日期</label><input class="input" id="bEnd" type="date" value="${esc(b?.endDate||'')}"><label>我的評分（1～5）</label><input class="input" id="bRating" type="number" min="1" max="5" step="1" value="${esc(b?.rating||'')}"><label>我的標籤（逗號分隔）</label><input class="input" id="bTags" value="${esc((b?.tags||[]).join(','))}"><label>書籍備註</label><textarea class="textarea" id="bNotes">${esc(b?.notes||'')}</textarea><div class="actions"><button class="btn" onclick="saveBook(${id||0})">儲存</button><button class="btn ghost" onclick="closeModal()">取消</button></div></div>`;showModal()}
function saveBook(id){let old=id&&data.books.find(x=>x.id===id);let b={id:id||Date.now(),title:bTitle.value||'未命名書籍',author:bAuthor.value,category:bCat.value||'未分類',status:bStatus.value,progress:+bProg.value,notes:bNotes.value,startDate:bStart.value,endDate:bEnd.value,rating:bRating.value?+bRating.value:null,tags:bTags.value.split(',').map(x=>x.trim()).filter(Boolean),fav:old?.fav||false,created:old?.created||Date.now()};if(id)data.books=data.books.map(x=>x.id===id?b:x);else data.books.unshift(b);save();closeModal();render()}

function aiMock(){let t=document.getElementById('aiText').value.trim();document.getElementById('aiResult').innerHTML=`<div class="card" style="margin-top:12px;background:#f8f0e9"><strong>AI 整理預覽</strong><p><b>本章重點</b><br>${esc(t?t.slice(0,180)+'…':'請先貼上內容')}</p><p><b>3～5 個重要觀念</b><br>① 核心觀念提取<br>② 作者主要論點<br>③ 重要案例<br>④ 可執行方法<br>⑤ 我的應用</p><button class="btn secondary" onclick="openRecord('閱讀筆記')">💾 儲存成閱讀筆記</button></div>`}function showModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='miaolu-ai-workspace.json';a.click()}function resetData(){if(confirm('確定重設示範資料？')){localStorage.removeItem(KEY);location.reload()}}function render(){nav();let html=page===''?dashboard():page==='投資'?invest():page==='自媒體'?media():page==='美妝'?beauty():page==='閱讀'?reading():page==='紀錄'?records():page==='搜尋'?searchPage():settings();document.getElementById('content').innerHTML=html}render();</script></body></html>
